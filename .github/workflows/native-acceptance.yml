name: Native acceptance
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to execute
        type: choice
        options: [all, native, files, inspect]
        default: all
      inspect_run:
        description: Existing run to inspect
        type: string
  push:
    branches: [codex/hermes-native-acceptance]
  pull_request:
    paths: ['Hermes/**', 'HermesTests/**', 'HermesUITests/**', 'Hermes.xcodeproj/**', 'tools/**', '.github/workflows/native-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: native-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    if: ${{ inputs.scope != 'inspect' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project and isolated simulator
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          gem install xcodeproj --no-document --user-install
          ruby tools/generate_project.rb
          mkdir -p evidence
          xcodebuild -version > evidence/environment.txt
          sw_vers >> evidence/environment.txt
          xcrun simctl list runtimes >> evidence/environment.txt
          simulator=$(xcrun simctl create Hermes-Acceptance com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "HERMES_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Run existing regression tests
        if: ${{ inputs.scope == 'all' || inputs.scope == '' }}
        run: |
          set -euo pipefail
          xcodebuild -project Hermes.xcodeproj -scheme HermesTests -destination "platform=iOS Simulator,id=$HERMES_SIMULATOR" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO -resultBundlePath evidence/Regression.xcresult test > evidence/regression.log 2>&1
      - name: Run native interaction and system file acceptance
        if: ${{ !cancelled() }}
        env:
          HERMES_TEST_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          selection=(-project Hermes.xcodeproj -scheme HermesUITests)
          if [ "$HERMES_TEST_SCOPE" = files ]; then
            selection+=("-only-testing:HermesUITests/NativeAcceptanceTests/testNativeSystemFileExportImportConflictsAndFreshInstallation")
          fi
          xcodebuild "${selection[@]}" -destination "platform=iOS Simulator,id=$HERMES_SIMULATOR" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO -resultBundlePath evidence/NativeAcceptance.xcresult test > evidence/native-acceptance.log 2>&1
      - name: Verify Release build
        if: ${{ !cancelled() && (inputs.scope == 'all' || inputs.scope == '') }}
        run: |
          set -euo pipefail
          xcodebuild -project Hermes.xcodeproj -scheme Hermes -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -onlyUsePackageVersionsFromResolvedFile build > evidence/release-build.log 2>&1
      - name: Collect evidence
        if: always()
        run: |
          cp -R Hermes.xcodeproj evidence/Generated-Hermes.xcodeproj
          for bundle in evidence/*.xcresult; do
            xcrun xcresulttool get test-results summary --path "$bundle" > "$bundle-summary.json" || true
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$bundle-attachments" || true
          done
          if [ -n "${HERMES_SIMULATOR:-}" ]; then
            codesign --display --verbose=2 build/DerivedData/Build/Products/Debug-iphonesimulator/Hermes.app > evidence/app-signature.txt 2>&1 || true
            xcrun simctl spawn "$HERMES_SIMULATOR" log show --last 20m --style compact --predicate '(process == "fileproviderd" OR process CONTAINS "DocumentManager" OR subsystem BEGINSWITH "com.apple.FileProvider") AND (eventMessage CONTAINS[c] "error" OR eventMessage CONTAINS[c] "fail" OR eventMessage CONTAINS[c] "denied" OR eventMessage CONTAINS[c] "signature")' > evidence/file-provider.log 2>&1 || true
            xcrun simctl shutdown "$HERMES_SIMULATOR" || true
            xcrun simctl delete "$HERMES_SIMULATOR" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-native-diagnostics-${{ github.run_id }}
          path: |
            evidence/*.log
            evidence/*-summary.json
            evidence/environment.txt
            evidence/app-signature.txt
            evidence/NativeAcceptance.xcresult-attachments/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-native-acceptance-${{ github.run_id }}
          path: evidence/
          retention-days: 14
  inspect:
    if: ${{ inputs.scope == 'inspect' }}
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export existing result diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSPECT_RUN: ${{ inputs.inspect_run }}
        run: |
          set -euo pipefail
          [[ "$INSPECT_RUN" =~ ^[0-9]+$ ]]
          sudo xcode-select -s /Applications/Xcode_16.4.app
          gh run download "$INSPECT_RUN" --repo "$GH_REPO" --name "hermes-native-acceptance-$INSPECT_RUN" --dir previous-results
          xcrun xcresulttool export diagnostics --path previous-results/NativeAcceptance.xcresult --output-path diagnostics
          mkdir -p crash-evidence
          xcrun xcresulttool get object --legacy --format json --path previous-results/NativeAcceptance.xcresult > crash-evidence/result-root.json
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          root = Path("diagnostics")
          for archive in list(root.rglob("*.zip")):
              try:
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(archive.with_suffix(""))
              except zipfile.BadZipFile:
                  pass
          files = [p for p in root.rglob("*") if p.is_file()]
          Path("crash-evidence/files.txt").write_text("\n".join(str(p) for p in files))
          found = []
          for p in files:
              if p.suffix.lower() in (".ips", ".crash") and "hermes" in p.name.lower():
                  destination = Path("crash-evidence") / (str(len(found)) + "-" + p.name)
                  shutil.copy2(p, destination)
                  found.append(destination)
                  print(p)
                  print(p.read_text(errors="replace")[:45000])
          print("Hermes crash reports:", len(found))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-crash-evidence-${{ github.run_id }}
          path: crash-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-raw-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 14
